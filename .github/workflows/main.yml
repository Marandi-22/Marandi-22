name: generate pacman game

on:
  schedule:          # automatically every day
    - cron: "0 0 * * *"
  workflow_dispatch: # manual trigger
  push:
    branches:
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checkout your repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Generate the Pac-Man SVG (light + dark)
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          theme: light,dark   # Generate both light and dark SVGs

      # Move both SVGs to root output/ and commit to master
      - name: Move and commit Pac-Man SVGs
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          mv dist/pacman-contribution-graph.svg $GITHUB_WORKSPACE/output/
          mv dist/pacman-contribution-graph-dark.svg $GITHUB_WORKSPACE/output/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/pacman-contribution-graph.svg output/pacman-contribution-graph-dark.svg
          git commit -m "Update Pac-Man contribution graphs [skip ci]" || echo "No changes"
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
